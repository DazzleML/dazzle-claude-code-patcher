[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzle-claude-code-patcher"
dynamic = ["version"]
description = "Windows-first patch tool for the native Claude Code CLI: apply, verify and diagnose community patches across releases."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"  # tomllib, for patch specs
authors = [
    {name = "Dustin Darcy (djdarcy)", email = "djdarcy@users.noreply.github.com"},
]
keywords = ["claude-code", "patcher", "bun", "windows", "anthropic", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

# Standard library only: the patcher must run anywhere Python does, with nothing
# to install beyond itself.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/DazzleML/dazzle-claude-code-patcher"
Repository = "https://github.com/DazzleML/dazzle-claude-code-patcher"
Issues = "https://github.com/DazzleML/dazzle-claude-code-patcher/issues"

[project.scripts]
dcc-patcher = "dcc_patcher.cli:main"

[tool.setuptools.dynamic]
version = {attr = "dcc_patcher._version.PIP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["dcc_patcher", "dcc_patcher.*"]

# The bundled patch specs and the launcher's shim templates are data, not modules:
# without this a wheel installs without them (#4).
[tool.setuptools.package-data]
dcc_patcher = ["patches/*/*.toml", "patches/*/*.md", "shims/*.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pre-push hook runs `python -P -m pytest` (no current directory on sys.path),
# so name the project root explicitly for test runs; an editable install isn't needed.
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.repokit-common]
version-source = "dcc_patcher/_version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/DazzleML/dazzle-claude-code-patcher"
tag-prefix = "v"
# poc/out/ holds patched Claude Code builds (proprietary binaries): never commit them.
private-patterns = ["private/", "local/", ".env", "poc/out/"]
