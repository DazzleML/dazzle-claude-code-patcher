# History past compaction: after a restart or --resume, scroll back past compactions.
# Proven on Claude Code 2.1.289 (Windows); see README.md beside this file.
format = 1
id = "H"
title = "History past compaction"
issue = "DazzleML/dazzle-claude-code-patcher#1"
module_marker = "tengu_chain_parent_cycle"
signature = "/*dazzle-claude-code:history-v1*/"

# Where the chain walk continues from a compaction row h (map e, chain set g):
# 1. its logicalParentUuid when that message is not on the chain yet;
# 2. else the last preserved message not yet on the chain (an earlier compaction,
#    whose preserved tail sits after the summary);
# 3. else the original parent of the preserved head, recorded by the prune before
#    it relinked the head (the last compaction);
# 4. else, when the pick is missing or already on the chain, the latest row before
#    the boundary in file order (the map keeps insertion order) that is not on the
#    chain yet, on the same side (isSidechain) and of a chain type. This is the
#    shape where every preserved message reached disk after the summary, already
#    relinked onto it (they were in flight when the compaction ran), so the head's
#    original parent is not recorded anywhere and file order is the only evidence.
# It also sets DCC_PATCH_H in the main process's environment (#8): plugin hooks run
# in an isolated context where globalThis is not shared, but $.env.get reads this
# environment, so a plugin can tell that early messages are reachable rows.
prelude = '''process.env.DCC_PATCH_H="history-v1";globalThis.__dzCross=(h,e,g)=>{if(h?.type!=="system"||h.subtype!=="compact_boundary")return;let L=h.logicalParentUuid,M=h.compactMetadata,U=M?.preservedMessages?.uuids??[],H0=M?.preservedSegment?.headUuid??U[0],S0=!!L&&g.has(L),w,how="lpu";if(L&&!S0)w=L;else if(L){how="preserved";for(let k=U.length-1;k>=0;k--)if(!g.has(U[k])&&e.has(U[k])){w=U[k];break}if(!w&&H0){how="head-parent";w=globalThis.__dzOrigParent?.[H0]??e.get(H0)?.parentUuid}}if((!w||!e.has(w)||g.has(w))&&e.has(h.uuid)){how="file-order";w=void 0;let sc=!!h.isSidechain;for(let[k,r]of e){if(k===h.uuid)break;if(!g.has(k)&&!!r.isSidechain===sc&&(r.type==="user"||r.type==="assistant"||r.type==="attachment"||r.type==="system"))w=k}}globalThis.__dzLog?.(`walk: boundary ${h.uuid} lpu=${L} seen=${S0} via=${how} -> ${w}`);return w};'''

debug_prelude = '''globalThis.__dzLog=(m)=>{try{import.meta.require("fs").appendFileSync(process.env.DZ_DEBUG_LOG||"dcc-debug.log",new Date().toISOString()+" "+m+"\n")}catch{}};globalThis.__dzLog("module loaded");'''

# Fixed upstream if the chain walker itself reads logicalParentUuid: no build from
# 2.1.278 to 2.1.289 does, and following it is how a fix would cross the boundary.
# An inference, not a known fix; revisit when Anthropic ships one.
[upstream_fixed]
near = "tengu_chain_parent_cycle"
window = 1500
pattern = 'logicalParentUuid'

[[edit]]
name = "loader: always parse the lines before the last compaction"
# The loader reads one switch into a local; on, the lines before the last compaction
# are parsed like any others. Through 2.1.329 the read was a call on process.env,
# from 2.1.330 a property of a settings object. The edit takes whatever is assigned
# from the switch: it starts right after the "=" and ends at the "," or ";" that
# closes the declarator. A second function (2.1.319 on) tests the same switch inline
# to decide where a tail load starts; it follows "||", not "=", and is left alone.
pattern = '(?<==)[\w$.(]*CLAUDE_CODE_DISABLE_PRECOMPACT_SKIP\)?(?=[,;])'
replace = '!0'

[[edit]]
name = "prune: remember where the preserved segment originally attached"
near = "tengu_relink_walk_broken"
window = 3000
pattern = 'if\((?P<D>[\w$]+)\)\{let (?P<he>[\w$]+)=(?P<B>[\w$]+)\.at\(-1\),(?P<ye>[\w$]+)=(?P=D)\.anchorUuid;for\(let (?P<be>[\w$]+) of (?P=B)\)\{let (?P<Ee>[\w$]+)=(?P<e>[\w$]+)\.get\((?P=be)\);'
replace = 'if(@@D@@){(globalThis.__dzOrigParent??={})[@@B@@[0]]=@@e@@.get(@@B@@[0])?.parentUuid;let @@he@@=@@B@@.at(-1),@@ye@@=@@D@@.anchorUuid;for(let @@be@@ of @@B@@){let @@Ee@@=@@e@@.get(@@be@@);'

[[edit]]
name = "prune: keep the messages before the last compaction"
near = "tengu_relink_walk_broken"
window = 3000
pattern = 'for\(let (?P<x>[\w$]+) of (?P<V>[\w$]+)\)@@e@@\.delete\((?P=x)\);'
replace = ''

[[edit]]
name = "prune: do not rewire the kept messages themselves"
near = "tengu_relink_walk_broken"
window = 3000
pattern = '(?P<E>[\w$]+)\.parentUuid!==null&&(?P<Y>[\w$]+)\.has\((?P=E)\.parentUuid\)\)@@e@@\.set\((?P<b>[\w$]+),\{\.\.\.(?P=E),parentUuid:(?P<t>[\w$]+)\}\)'
replace = '@@E@@.parentUuid!==null&&@@Y@@.has(@@E@@.parentUuid)&&!@@Y@@.has(@@b@@))@@e@@.set(@@b@@,{...@@E@@,parentUuid:@@t@@})'

[[edit]]
name = "pre-parse walk: keep lines off the newest chain (file and v5 paths)"
pattern = '!(?P<n>[\w$]+)\?\.keepAllLeaves&&(?P<buf>[\w$]+)\.length>(?P<lim>[\w$]+)\)(?P=buf)=(?P<walk>[\w$]+)\((?P=buf)\)'
replace = '!1&&@@buf@@.length>@@lim@@)@@buf@@=@@walk@@(@@buf@@)'
expect = 2

# Two things in one site, because the second statement follows the first directly in
# every release from 2.1.278 on: at a row with no parent, ask __dzCross; and at a row
# whose parent is missing or already on the chain, try the parent the prune recorded
# for it (__dzOrigParent, set for the preserved head) before the walker's own fallback
# (the nearest unseen row within 5 s). The second case is a resume right after an
# idle compaction: nothing follows the summary, so the walk reaches the preserved
# rows through their tail and arrives at the head from the wrong side, where its
# in-memory parent is the summary it just left.
[[edit]]
name = "walker: cross a compaction boundary; at a relinked head, continue where the prune recorded"
near = "tengu_chain_parent_cycle"
window = 1500
# The 5-second fallback took (entries, row, seen) through 2.1.312; from 2.1.314 a
# per-walk cache object comes first: (cache, entries, row, seen). The argument list
# is captured whole (@@fbargs@@) and reproduced as written, so both shapes apply.
pattern = '(?P<g>[\w$]+)\.add\((?P<h>[\w$]+)\.uuid\),(?P<s>[\w$]+)\.push\((?P=h)\);let (?P<w>[\w$]+)=(?P=h)\.parentUuid;if\(!(?P=w)\)break;let (?P<Dw>[\w$]+)=(?P<em>[\w$]+)\.get\((?P=w)\);if\(!(?P=Dw)\|\|(?P=g)\.has\((?P=Dw)\.uuid\)\)\{if\((?P=Dw)=(?P<fb>[\w$]+)\((?P<fbargs>(?:[\w$]+,)?(?P=em),(?P=h),(?P=g))\),(?P=Dw)\)(?P<tel>[\w$]+)\("tengu_chain_timestamp_fallback",\{\}\)\}'
replace = '@@g@@.add(@@h@@.uuid),@@s@@.push(@@h@@);let @@w@@=@@h@@.parentUuid;if(!@@w@@)@@w@@=globalThis.__dzCross(@@h@@,@@em@@,@@g@@);if(!@@w@@)break;let @@Dw@@=@@em@@.get(@@w@@);if(!@@Dw@@||@@g@@.has(@@Dw@@.uuid)){let __dzO=globalThis.__dzOrigParent?.[@@h@@.uuid];if(__dzO&&!@@g@@.has(__dzO)&&@@em@@.has(__dzO))@@Dw@@=@@em@@.get(__dzO),globalThis.__dzLog?.(`walk: relinked head ${@@h@@.uuid} -> ${__dzO}`);else if(@@Dw@@=@@fb@@(@@fbargs@@),@@Dw@@)@@tel@@("tengu_chain_timestamp_fallback",{})}'
