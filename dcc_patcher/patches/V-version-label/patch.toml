# Version label: a patched build says so. `claude-dcc.exe --version` prints
#   2.1.289 + dcc 0.1.3 (Dazzle Claude Code)
# -- Claude Code's own version, this tool's version, and that it is our build --
# instead of `2.1.289 (Claude Code)`.
#
# Only the displayed text changes. Claude Code's version constant is left alone,
# because the updater and compatibility checks read it.
format = 1
id = "V"
title = "Version label"
issue = "DazzleML/dazzle-claude-code-patcher#1"

# Two modules print the version: the entry module's fast path for --version, and
# the command parser's -v/--version option. Both append " (Claude Code)" to the
# version constant.
module_marker = "(Claude Code)"
modules = 2
signature = "/*dazzle-claude-code:version-label-v1*/"

[[edit]]
name = "--version: name the patcher's version and the Dazzle build"
pattern = '\.VERSION\} \(Claude Code\)'
replace = '.VERSION} + dcc @@dcc_version@@ (Dazzle Claude Code)'
